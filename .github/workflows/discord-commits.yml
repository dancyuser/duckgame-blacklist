name: Discord commit alerts

on:
  push:
    # можно сузить до веток:
    branches: ["main"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.event.head_commit.url }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          wh = os.environ["DISCORD_WEBHOOK_URL"]
          repo = os.environ["REPO"]
          actor = os.environ["ACTOR"]
          ref = os.environ["REF"]
          sha = (os.environ.get("SHA") or "")[:7]
          msg = (os.environ.get("MSG") or "").splitlines()[0][:200]
          url = os.environ.get("URL") or ""
          content = f"**{repo}**: {actor} → `{ref}` `{sha}` — {msg}\n{url}"
          payload = json.dumps({"content": content}).encode("utf-8")
          req = urllib.request.Request(wh, data=payload, headers={"Content-Type":"application/json"})
          urllib.request.urlopen(req).read()
          PY
